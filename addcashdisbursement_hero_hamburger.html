<body>
<button class="menu-button" id="menuButton" type="button" aria-label="Open menu"><span></span><span></span><span></span></button>

<aside class="side-menu" id="sideMenu">

<div class="container">

    <h1>DEEGEES TAILORING</h1>
    <h1>ADD CASH DISBURSEMENT</h1>

    <div class="card">
        <div class="grid">
            <div>
                <label for="owner">GitHub Owner</label>
                <input id="owner" value="DeeGees-Tailoring">
            </div>

            <div>
                <label for="repo">Repository</label>
                <input id="repo" value="General-Journal">
            </div>
        </div>

        <div class="grid">
            <div>
                <label for="branch">Branch</label>
                <input id="branch" value="main">
            </div>

            <div>
                <label for="token">GitHub PAT</label>
                <input id="token" type="password" placeholder="Paste GitHub Personal Access Token">
            </div>
        </div>

        <div class="grid">
            <div>
                <label for="cdPath">Cash Disbursement File</label>
                <input id="cdPath" value="cashdisbursements.js">
            </div>

            </div>

        <label for="cdNo">Cash Disbursement No.</label>

        <label for="category">Category</label>
        <select id="category">
            <option value="">Loading categories...</option>
        </select>
        <div class="hint">Categories are loaded from categories.js.</div>

        <label for="description">Description</label>
        <textarea id="description" placeholder="What was the cash disbursement for?"></textarea>

        <label for="amount">Amount</label>
        <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">

        <button id="addBtn" type="submit">ADD CASH DISBURSEMENT</button>

    </form>

    <div class="card">
        <h2>Preview</h2>
        <div id="preview" class="preview"></div>
    </div>

 

</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

let currentCdSha = null;
let currentJournalSha = null;
let currentCashDisbursements = {};
let currentEntries = {};
let currentCategories = [];

function githubHeaders(token) {
    return {
        "Accept": "application/vnd.github+json",
        "Authorization": "Bearer " + token,
        "X-GitHub-Api-Version": "2022-11-28"
    };
}

function base64ToUtf8(base64) {
    const binary = atob(base64.replace(/\n/g, ""));
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
}

function utf8ToBase64(text) {
    const bytes = new TextEncoder().encode(text);
    let binary = "";
    const chunk = 0x8000;

    for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
    }

    return btoa(binary);
}

function jsString(value) {
    return JSON.stringify(String(value ?? ""));
}

/*
    Reads a simple object of the form:

    const variableName = {
        "KEY": {
            Field: "value"
        }
    };
*/
function parseObjectJs(source, variableName) {

    const result = {};

    const declaration = "const " + variableName + " =";
    const start = source.indexOf(declaration);

    if (start === -1) {
        throw new Error(
            "Could not find const " + variableName + " in the JavaScript file."
        );
    }

    const objectStart = source.indexOf("{", start);
    const objectEnd = source.lastIndexOf("}");

    if (
        objectStart === -1 ||
        objectEnd === -1 ||
        objectEnd <= objectStart
    ) {
        throw new Error("Invalid " + variableName + " structure.");
    }

    const body = source.slice(objectStart + 1, objectEnd);

    const entryRegex =
        /(["'])(.*?)\1\s*:\s*\{([\s\S]*?)\n\s*\}/g;

    let match;

    while ((match = entryRegex.exec(body)) !== null) {

        const key = match[2];
        const entryBody = match[3];

        const getField = name => {

            const re = new RegExp(
                "\\b" + name + "\\s*:\\s*([\"'])([\\s\\S]*?)\\1"
            );

            const fieldMatch = entryBody.match(re);

            return fieldMatch ? fieldMatch[2] : "";
        };

        result[key] = {
            Date: getField("Date"),
            Payee: getField("Payee"),
            Category: getField("Category"),
            Description: getField("Description"),
            Amount: getField("Amount"),
            Type: getField("Type")
        };
    }

    return result;
}

function parseCashDisbursementsJs(source) {
    return parseObjectJs(source, "cashDisbursements");
}

function parseEntriesJs(source) {
    return parseObjectJs(source, "entries");
}

function parseCategoriesJs(source) {

    const match = source.match(
        /const\s+categories\s*=\s*(\[[\s\S]*?\])\s*;?/
    );

    if (!match) {
        throw new Error(
            "Could not find const categories in categories.js."
        );
    }

    try {
        const parsed = Function(
            `"use strict"; return (${match[1]});`
        )();

        if (!Array.isArray(parsed)) {
            throw new Error("categories is not an array.");
        }

        return parsed.map(item => String(item)).filter(Boolean);

    } catch (error) {
        throw new Error(
            "Invalid categories.js format. " + error.message
        );
    }
}

function populateCategorySelect(categories) {

    const select = $("category");
    const previousValue = select.value;

    select.innerHTML = "";

    if (!categories.length) {
        select.innerHTML =
            '<option value="">No categories available</option>';
        updatePreview();
        return;
    }

    categories.forEach(category => {

        const option = document.createElement("option");

        option.value = category;
        option.textContent = category;

        select.appendChild(option);
    });

    if (categories.includes(previousValue)) {
        select.value = previousValue;
    }

    updatePreview();
}

function nextCdNumber(cashDisbursements) {

    let max = 0;

    Object.keys(cashDisbursements).forEach(key => {

        const match = key.match(/^CD#(\d+)$/i);

        if (match) {
            max = Math.max(max, Number(match[1]));
        }

    });

    return max + 1;
}

function formatCdNumber(number) {
    return "CD#" + String(number).padStart(5, "0");
}

function buildCashDisbursementsJs(records) {

    const keys = Object.keys(records).sort((a, b) => {

        const na =
            Number((a.match(/#(\d+)$/) || ["", "0"])[1]);

        const nb =
            Number((b.match(/#(\d+)$/) || ["", "0"])[1]);

        return na - nb;
    });

    let out = "const cashDisbursements = {\n";

    keys.forEach((key, index) => {

        const cd = records[key];

        out += `    ${jsString(key)}: {\n`;
        out += `        Date: ${jsString(cd.Date)},\n`;
        out += `        Payee: ${jsString(cd.Payee)},\n`;
        out += `        Category: ${jsString(cd.Category)},\n`;
        out += `        Description: ${jsString(cd.Description)},\n`;
        out += `        Amount: ${jsString(cd.Amount)}\n`;
        out += "    }" + (index < keys.length - 1 ? "," : "") + "\n\n";
    });

    out += "};\n";

    return out;
}

function buildEntriesJs(records) {

    const keys = Object.keys(records).sort((a, b) => {

        const dateA = String(records[a].Date || "");
        const dateB = String(records[b].Date || "");

        if (dateA !== dateB) {
            return dateA.localeCompare(dateB);
        }

        const na =
            Number((a.match(/#(\d+)$/) || ["", "0"])[1]);

        const nb =
            Number((b.match(/#(\d+)$/) || ["", "0"])[1]);

        return na - nb;
    });

    let out = "const entries = {\n";

    keys.forEach((key, index) => {

        const entry = records[key];

        out += `    ${jsString(key)}: {\n`;
        out += `        Type: ${jsString(entry.Type)},\n`;
        out += `        Date: ${jsString(entry.Date)},\n`;
        out += `        Category: ${jsString(entry.Category)},\n`;
        out += `        Description: ${jsString(entry.Description)},\n`;
        out += `        Amount: ${jsString(entry.Amount)}\n`;
        out += "    }" + (index < keys.length - 1 ? "," : "") + "\n\n";
    });

    out += "};\n";

    return out;
}

function githubContentsUrl(owner, repo, path, branch) {

    return (
        `https://api.github.com/repos/` +
        `${encodeURIComponent(owner)}/` +
        `${encodeURIComponent(repo)}/contents/` +
        `${path.split("/").map(encodeURIComponent).join("/")}` +
        `?ref=${encodeURIComponent(branch)}`
    );
}

async function readGithubFile(
    token,
    owner,
    repo,
    branch,
    path,
    label
) {

    const response = await fetch(
        githubContentsUrl(owner, repo, path, branch),
        {
            headers: githubHeaders(token)
        }
    );

    if (!response.ok) {

        let detail = "";

        try {
            const data = await response.json();
            detail = data.message
                ? " " + data.message
                : "";
        } catch (_) {}

        throw new Error(
            "GitHub could not read " + label + "." + detail +
            " (HTTP " + response.status + ")"
        );
    }

    const data = await response.json();

    return {
        sha: data.sha,
        source: base64ToUtf8(data.content)
    };
}

function showStatus(message, type = "") {

    const status = $("status");

    status.textContent = message;
    status.className = "status " + type;
}

async function loadFiles() {

    const token = $("token").value.trim();

    const owner = $("owner").value.trim();
    const repo = $("repo").value.trim();
    const requestedBranch = $("branch").value.trim();

    const cdPath = $("cdPath").value.trim();
    const journalPath = $("journalPath").value.trim();

    if (!token) {
        throw new Error("Enter your GitHub PAT first.");
    }

    if (!requestedBranch) {
        throw new Error("Enter the GitHub branch name first.");
    }

    // Try the branch entered by the user first. If it does not exist,
    // also try the common alternate capitalization: main <-> Main.
    const branches = [requestedBranch];

    if (requestedBranch === "main") {
        branches.push("Main");
    } else if (requestedBranch === "Main") {
        branches.push("main");
    }

    let lastError = null;

    for (const branch of branches) {

        try {

            const cdFile = await readGithubFile(
                token,
                owner,
                repo,
                branch,
                cdPath,
                "cashdisbursements.js"
            );

            const journalFile = await readGithubFile(
                token,
                owner,
                repo,
                branch,
                journalPath,
                "entries.js"
            );

            const categoriesFile = await readGithubFile(
                token,
                owner,
                repo,
                branch,
                "categories.js",
                "categories.js"
            );

            const cashDisbursements =
                parseCashDisbursementsJs(cdFile.source);

            const entries =
                parseEntriesJs(journalFile.source);

            const categories =
                parseCategoriesJs(categoriesFile.source);

            if (!categories.length) {
                throw new Error("categories.js contains no categories.");
            }

            // Remember the branch that actually worked so saving uses it too.
            $("branch").value = branch;

            currentCdSha = cdFile.sha;
            currentJournalSha = journalFile.sha;
            currentCashDisbursements = cashDisbursements;
            currentEntries = entries;
            currentCategories = categories;

            populateCategorySelect(currentCategories);

            $("cdNo").value =
                formatCdNumber(
                    nextCdNumber(currentCashDisbursements)
                );

            updatePreview();

            return;

        } catch (error) {
            lastError = error;
        }
    }

    throw lastError || new Error("Could not load the GitHub files.");
}

function updatePreview() {

    const key =
        $("cdNo").value || "CD#00000";

    $("preview").textContent =
`"${key}": {
    Date: ${jsString($("date").value)},
    Payee: ${jsString($("payee").value)},
    Category: ${jsString($("category").value)},
    Description: ${jsString($("description").value)},
    Amount: ${jsString($("amount").value)}
}`;
}

[
    "date",
    "payee",
    "category",
    "description",
    "amount"
].forEach(id => {

    $(id).addEventListener(
        "input",
        updatePreview
    );

    $(id).addEventListener(
        "change",
        updatePreview
    );
});

$("token").addEventListener("change", async () => {

    if (!$("token").value.trim()) {
        return;
    }

    try {

        showStatus(
            "Reading cashdisbursements.js, entries.js, and categories.js..."
        );

        await loadFiles();

        showStatus(
            "Cash disbursement number loaded.",
            "ok"
        );

    } catch (error) {

        showStatus(
            error.message,
            "err"
        );
    }
});

$("refreshBtn").addEventListener(
    "click",
    async () => {

        try {

            showStatus(
                "Reading the latest files..."
            );

            await loadFiles();

            showStatus(
                "Cash disbursement number refreshed.",
                "ok"
            );

        } catch (error) {

            showStatus(
                error.message,
                "err"
            );
        }
    }
);

async function updateGithubFile(
    token,
    owner,
    repo,
    branch,
    path,
    sha,
    source,
    message
) {

    const url =
        `https://api.github.com/repos/` +
        `${encodeURIComponent(owner)}/` +
        `${encodeURIComponent(repo)}/contents/` +
        `${path.split("/").map(encodeURIComponent).join("/")}`;

    const response = await fetch(
        url,
        {
            method: "PUT",
            headers: {
                ...githubHeaders(token),
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message,
                content: utf8ToBase64(source),
                branch,
                sha
            })
        }
    );

    const result = await response.json();

    if (!response.ok) {
        throw new Error(
            result.message ||
            "GitHub rejected the update for " + path + "."
        );
    }

    return result;
}

$("cdForm").addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const button = $("addBtn");
        const token = $("token").value.trim();

        if (!token) {

            showStatus(
                "Enter your GitHub PAT first.",
                "err"
            );

            return;
        }

        if (!$("date").value) {

            showStatus(
                "Please enter the date.",
                "err"
            );

            return;
        }

        if (!$("payee").value.trim()) {

            showStatus(
                "Please enter the payee.",
                "err"
            );

            return;
        }

        if (!$("description").value.trim()) {

            showStatus(
                "Please enter the description.",
                "err"
            );

            return;
        }

        if (!$("category").value.trim()) {

            showStatus(
                "Please select a category.",
                "err"
            );

            return;
        }

        if (!$("amount").value.trim()) {

            showStatus(
                "Please enter the amount.",
                "err"
            );

            return;
        }

        button.disabled = true;

        try {

            /*
                Read the latest versions immediately before saving.
                This prevents using an old SHA or old numbering.
            */
            showStatus(
                "Reading the latest files..."
            );

            await loadFiles();

            const number =
                nextCdNumber(
                    currentCashDisbursements
                );

            const key =
                formatCdNumber(number);

            const cd = {

                Date: $("date").value.trim(),

                Payee: $("payee").value.trim(),

                Category: $("category").value,

                Description:
                    $("description").value.trim(),

                Amount:
                    $("amount").value.trim()
            };

            /*
                Full record for cashdisbursements.js
            */
            currentCashDisbursements[key] = cd;

            /*
                Summary record for General Journal.
            */
            currentEntries[key] = {

                Type: "Cash Disbursement",

                Date: cd.Date,

                Category: cd.Category,

                Description: cd.Description,

                Amount: cd.Amount
            };

            const newCdSource =
                buildCashDisbursementsJs(
                    currentCashDisbursements
                );

            const newEntriesSource =
                buildEntriesJs(
                    currentEntries
                );

            const owner =
                $("owner").value.trim();

            const repo =
                $("repo").value.trim();

            const branch =
                $("branch").value.trim();

            const cdPath =
                $("cdPath").value.trim();

            const journalPath =
                $("journalPath").value.trim();

            showStatus(
                "Saving " + key +
                " to cashdisbursements.js..."
            );

            const cdResult =
                await updateGithubFile(
                    token,
                    owner,
                    repo,
                    branch,
                    cdPath,
                    currentCdSha,
                    newCdSource,
                    "Add " + key +
                    " to cash disbursements"
                );

            try {

                showStatus(
                    "Saving " + key +
                    " to entries.js..."
                );

                const journalResult =
                    await updateGithubFile(
                        token,
                        owner,
                        repo,
                        branch,
                        journalPath,
                        currentJournalSha,
                        newEntriesSource,
                        "Add " + key +
                        " to journal"
                    );

                currentCdSha =
                    cdResult.content.sha;

                currentJournalSha =
                    journalResult.content.sha;

                currentCashDisbursements =
                    parseCashDisbursementsJs(
                        newCdSource
                    );

                currentEntries =
                    parseEntriesJs(
                        newEntriesSource
                    );

                $("cdForm").reset();

                $("cdNo").value =
                    formatCdNumber(
                        nextCdNumber(
                            currentCashDisbursements
                        )
                    );

                updatePreview();

                /*
                    Clear PAT after successful two-file save.
                */
                $("token").value = "";

                showStatus(
                    key +
                    " was successfully added to cashdisbursements.js and entries.js.",
                    "ok"
                );

            } catch (journalError) {

                /*
                    The first file was already committed.
                    Do not pretend the operation was atomic.
                */
                throw new Error(
                    key +
                    " was saved to cashdisbursements.js, " +
                    "but entries.js could not be updated. " +
                    "Please do not add the cash disbursement again; " +
                    "update entries.js first. " +
                    journalError.message
                );
            }

        } catch (error) {

            showStatus(
                error.message,
                "err"
            );

        } finally {

            button.disabled = false;
        }
    }
);

updatePreview();

</script>

<script>
(function(){
  const menuButton=document.getElementById("menuButton");
  const sideMenu=document.getElementById("sideMenu");
  const menuOverlay=document.getElementById("menuOverlay");
  function toggleMenu(){sideMenu.classList.toggle("open");menuOverlay.classList.toggle("show");}
  function closeMenu(){sideMenu.classList.remove("open");menuOverlay.classList.remove("show");}
  menuButton.addEventListener("click",toggleMenu);
  menuOverlay.addEventListener("click",closeMenu);
})();
</script>
</body>
</html>
