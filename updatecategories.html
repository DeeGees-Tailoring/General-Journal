<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Categories</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        button {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
            font-weight: bold;
        }

        #categoryList {
            margin-top: 20px;
        }

        .categoryRow {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .categoryRow span {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            background: #f5f5f5;
        }

        .deleteBtn {
            width: auto;
            margin: 0;
        }

        #status {
            margin-top: 20px;
            padding: 10px;
            white-space: pre-wrap;
        }

    </style>

</head>


<body>

    <h2>UPDATE CATEGORIES</h2>


    <label for="token">
        GitHub PAT
    </label>

    <input
        type="password"
        id="token"
        placeholder="Paste GitHub PAT here"
    >


    <label for="newCategory">
        New Category
    </label>

    <input
        type="text"
        id="newCategory"
        placeholder="Enter category"
    >


    <button id="addBtn">
        ADD CATEGORY
    </button>


    <div id="categoryList"></div>


    <button id="updateBtn">
        UPDATE CATEGORIES
    </button>


    <div id="status"></div>


<script>


/* =========================================
   GITHUB SETTINGS
   ========================================= */

const owner = "DeeGees-Tailoring";

const repo = "General-Journal";

const branch = "Main";

const file = "cdcategories.js";


/* =========================================
   VARIABLES
   ========================================= */

let categories = [];

let fileSha = null;


/* =========================================
   ELEMENTS
   ========================================= */

const tokenInput =
    document.getElementById("token");

const newCategoryInput =
    document.getElementById("newCategory");

const addBtn =
    document.getElementById("addBtn");

const updateBtn =
    document.getElementById("updateBtn");

const categoryList =
    document.getElementById("categoryList");

const status =
    document.getElementById("status");


/* =========================================
   DISPLAY CATEGORIES
   ========================================= */

function displayCategories() {

    categoryList.innerHTML = "";


    categories.forEach(function(category, index) {

        const row =
            document.createElement("div");

        row.className =
            "categoryRow";


        const text =
            document.createElement("span");

        text.textContent =
            category;


        const deleteBtn =
            document.createElement("button");

        deleteBtn.textContent =
            "DELETE";

        deleteBtn.className =
            "deleteBtn";


        deleteBtn.onclick =
            function() {

                categories.splice(index, 1);

                displayCategories();

            };


        row.appendChild(text);

        row.appendChild(deleteBtn);

        categoryList.appendChild(row);

    });

}


/* =========================================
   LOAD categories.js FROM GITHUB
   ========================================= */

async function loadCategories() {

    const token =
        tokenInput.value.trim();


    if (!token) {

        status.textContent =
            "Paste your GitHub PAT first.";

        return;

    }


    status.textContent =
        "Loading categories.js...";


    try {

        const url =
            `https://api.github.com/repos/${owner}/${repo}/contents/${file}?ref=${branch}`;


        const response =
            await fetch(url, {

                headers: {

                    "Authorization":
                        `Bearer ${token}`,

                    "Accept":
                        "application/vnd.github+json"

                }

            });


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Unable to read categories.js."
            );

        }


        /*
         * Save SHA.
         *
         * Required by GitHub when
         * updating an existing file.
         */

        fileSha =
            result.sha;


        /*
         * Decode Base64 content.
         */

        const decoded =
            decodeURIComponent(
                escape(
                    atob(result.content)
                )
            );


        /*
         * Extract the array from:
         *
         * const categories = [
         *     "Rent",
         *     "Utilities"
         * ];
         */

        const match =
            decoded.match(
                /const\s+categories\s*=\s*(\[[\s\S]*?\])\s*;/
            );


        if (!match) {

            throw new Error(
                "Could not find the categories array."
            );

        }


        /*
         * Convert the JavaScript array
         * into an actual JavaScript array.
         */

        categories =
            Function(
                `"use strict"; return (${match[1]});`
            )();


        displayCategories();


        status.textContent =
            "categories.js loaded successfully.";


    }

    catch (error) {

        console.error(error);

        status.textContent =
            "ERROR:\n\n" +
            error.message;

    }

}


/* =========================================
   ADD CATEGORY
   ========================================= */

addBtn.onclick =
    function() {

        const category =
            newCategoryInput.value.trim();


        if (!category) {

            return;

        }


        /*
         * Prevent duplicates.
         */

        if (
            categories.some(
                function(item) {

                    return item.toLowerCase() ===
                           category.toLowerCase();

                }
            )
        ) {

            alert(
                "That category already exists."
            );

            return;

        }


        categories.push(category);


        newCategoryInput.value = "";


        displayCategories();

    };


/* =========================================
   UPDATE categories.js
   ========================================= */

updateBtn.onclick =
    async function() {

        const token =
            tokenInput.value.trim();


        if (!token) {

            status.textContent =
                "Paste your GitHub PAT first.";

            return;

        }


        if (!fileSha) {

            status.textContent =
                "categories.js has not been loaded yet.";

            return;

        }


        status.textContent =
            "Updating categories.js...";


        try {

            /*
             * Build the new JS file.
             */

            const jsContent =
`const categories = [

${categories.map(function(category) {

    return `    ${JSON.stringify(category)}`;

}).join(",\n")}

];
`;


            /*
             * Convert to Base64.
             */

            const encodedContent =
                btoa(
                    unescape(
                        encodeURIComponent(
                            jsContent
                        )
                    )
                );


            /*
             * GitHub API URL.
             */

            const url =
                `https://api.github.com/repos/${owner}/${repo}/contents/${file}`;


            /*
             * Update existing file.
             */

            const response =
                await fetch(url, {

                    method: "PUT",

                    headers: {

                        "Authorization":
                            `Bearer ${token}`,

                        "Accept":
                            "application/vnd.github+json",

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                "Update categories.js",

                            content:
                                encodedContent,

                            sha:
                                fileSha,

                            branch:
                                branch

                        })

                });


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "GitHub update failed."
                );

            }


            /*
             * Save new SHA.
             */

            fileSha =
                result.content.sha;


            status.textContent =
                "SUCCESS!\n\n" +
                "categories.js has been updated.";


            /*
             * Clear PAT after successful update.
             */

            tokenInput.value = "";


        }

        catch (error) {

            console.error(error);

            status.textContent =
                "ERROR:\n\n" +
                error.message;

        }

    };


/* =========================================
   LOAD CATEGORIES WHEN PAT CHANGES
   ========================================= */

tokenInput.addEventListener(
    "change",
    loadCategories
);


</script>

</body>

</html>
```
