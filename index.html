<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>General Journal</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f2f4f7;
        color: #1f2937;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    h1 {
        text-align: center;
        margin: 0 0 10px;
    }

    h1:first-of-type {
        margin-top: 55px;
    }

    .status {
        background: white;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 15px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .entry {
        background: white;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 15px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .entry h2 {
        margin-top: 0;
        color: #2563eb;
        border-bottom: 1px solid #ddd;
        padding-bottom: 10px;
    }

    .row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 8px 0;
        border-bottom: 1px solid #eee;
    }

    .label {
        font-weight: bold;
        min-width: 120px;
    }

    .value {
        text-align: right;
        word-break: break-word;
    }

    .amount { font-weight: bold; }

    .empty {
        text-align: center;
        padding: 40px;
        background: white;
        border-radius: 14px;
    }

    .error {
        color: #b91c1c;
        background: #fee2e2;
        padding: 15px;
        border-radius: 10px;
    }

    /* Hamburger */
    .menu-button {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 1002;
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 12px;
        background: #2563eb;
        color: white;
        font-size: 26px;
        cursor: pointer;
        box-shadow: 0 3px 10px rgba(0,0,0,.2);
        margin: 0;
    }

    /* Side menu */
    .side-menu {
        position: fixed;
        top: 0;
        left: -290px;
        width: 290px;
        height: 100%;
        z-index: 1001;
        background: white;
        box-shadow: 4px 0 18px rgba(0,0,0,.18);
        transition: left .25s ease;
        overflow-y: auto;
    }

    .side-menu.open { left: 0; }

    .hero {
        height: 190px;
        background-image:
            linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)),
            url("https://raw.githubusercontent.com/DeeGees-Tailoring/General-Journal/refs/heads/main/images/heroDG.png");
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: flex-end;
        padding: 20px;
        color: white;
    }

    .hero h2 {
        margin: 0;
        font-size: 24px;
        text-shadow: 0 2px 5px rgba(0,0,0,.4);
    }

    .menu-content { padding: 18px; }

    .menu-content button {
        width: 100%;
        display: block;
        margin: 0 0 12px;
        border: 0;
        border-radius: 11px;
        padding: 14px 16px;
        font-weight: 700;
        font-size: 15px;
        text-align: left;
        background: #2563eb;
        color: white;
        cursor: pointer;
    }

    .menu-content button:hover { opacity: .9; }

    .overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0,0,0,.35);
        opacity: 0;
        visibility: hidden;
        transition: opacity .25s ease;
    }

    .overlay.show {
        opacity: 1;
        visibility: visible;
    }

    @media (max-width: 600px) {
        body { padding: 15px; }
        .row { flex-direction: column; gap: 4px; }
        .value { text-align: left; }
    }
</style>
</head>

<body>

    <button class="menu-button" id="menuButton" type="button" aria-label="Open menu">☰</button>

    <div class="overlay" id="menuOverlay"></div>

    <aside class="side-menu" id="sideMenu">
        <div class="hero">
            <h2>DEEGEES TAILORING</h2>
        </div>

        <div class="menu-content">
            <button type="button" onclick="window.location.href='invoices.html'">
                📄 VIEW INVOICES
            </button>

            <button type="button" onclick="window.location.href='addinvoices.html'">
                ➕ ADD INVOICE
            </button>

            <button type="button" onclick="window.location.href='cashdisbursement.html'">
                💰 VIEW CASH DISBURSEMENTS
            </button>

           <button type="button" onclick="window.location.href='addcashdisbursement.html'">
                ➕ ADD CASH DISBURSEMENT
           </button>
        </div>
    </aside>


<div class="container">

    <h1>DEEGEES TAILORING</h1>
    <h1>GENERAL JOURNAL</h1>

    <div id="status" class="status">
        Loading entries...
    </div>

    <div id="entries"></div>


</div>

<script>
document.getElementById("Inv").addEventListener("click", function() {
    window.location.href = "invoices.html";
});
document.getElementById("addCD").addEventListener("click", function() {
    window.location.href = "cashdisbursement.html";
});
</script>

<script>
const menuButton = document.getElementById("menuButton");
const sideMenu = document.getElementById("sideMenu");
const menuOverlay = document.getElementById("menuOverlay");

function toggleMenu() {
    sideMenu.classList.toggle("open");
    menuOverlay.classList.toggle("show");
}

function closeMenu() {
    sideMenu.classList.remove("open");
    menuOverlay.classList.remove("show");
}

menuButton.addEventListener("click", toggleMenu);
menuOverlay.addEventListener("click", closeMenu);
</script>

<script>

async function loadEntries() {

    const status = document.getElementById("status");
    const container = document.getElementById("entries");

    try {

        const response = await fetch("entries.js", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Unable to load entries.js");
        }

        const code = await response.text();

        // Kunin ang bagong entries object mula sa entries.js
        const entries = new Function(
            code + "\nreturn entries;"
        )();

        const keys = Object.keys(entries);

        if (keys.length === 0) {

            status.textContent = "No journal entries found.";

            container.innerHTML = `
                <div class="empty">
                    No journal entries yet.
                </div>
            `;

            return;
        }

        // Ayusin ayon sa Date, pagkatapos ay Type at entry number.
        keys.sort((a, b) => {

            const dateA = String(entries[a].Date || "");
            const dateB = String(entries[b].Date || "");

            if (dateA !== dateB) {
                return dateA.localeCompare(dateB);
            }

            const typeA = String(entries[a].Type || "");
            const typeB = String(entries[b].Type || "");

            if (typeA !== typeB) {
                return typeA.localeCompare(typeB);
            }

            const na = Number(
                (a.match(/#(\d+)$/) || ["", "0"])[1]
            );

            const nb = Number(
                (b.match(/#(\d+)$/) || ["", "0"])[1]
            );

            return na - nb;
        });

        status.textContent =
            `${keys.length} journal entr${keys.length > 1 ? "ies" : "y"} found.`;

        container.innerHTML = "";

        keys.forEach(key => {

            const entry = entries[key];

            const card = document.createElement("div");

            card.className = "entry";

            card.innerHTML = `

                <h2>${escapeHTML(key)}</h2>

                <div class="row">
                    <div class="label">Type</div>
                    <div class="value">
                        ${escapeHTML(entry.Type)}
                    </div>
                </div>

                <div class="row">
                    <div class="label">Date</div>
                    <div class="value">
                        ${escapeHTML(entry.Date)}
                    </div>
                </div>

                <div class="row">
                    <div class="label">Category</div>
                    <div class="value">
                        ${escapeHTML(entry.Category)}
                    </div>
                </div>

                <div class="row">
                    <div class="label">Description</div>
                    <div class="value">
                        ${escapeHTML(entry.Description)}
                    </div>
                </div>

                <div class="row">
                    <div class="label">Amount</div>
                    <div class="value amount">
                        ${escapeHTML("₱" + entry.Amount)}
                    </div>
                </div>

            `;

            container.appendChild(card);

        });

    } catch (error) {

        console.error(error);

        status.innerHTML = `
            <div class="error">
                Error loading entries.js: ${escapeHTML(error.message)}
            </div>
        `;

        container.innerHTML = "";

    }

}


// Security helper
function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


loadEntries();

</script>

</body>
</html>
