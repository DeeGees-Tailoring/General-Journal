<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create JS File</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        input,
        textarea,
        button {
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 16px;
        }

        textarea {
            height: 250px;
            font-family: monospace;
        }

        button {
            cursor: pointer;
            font-weight: bold;
        }

        #status {
            margin-top: 15px;
            padding: 10px;
            white-space: pre-wrap;
        }

    </style>

</head>


<body>

    <h2>CREATE JS FILE</h2>


    <label>GitHub PAT</label>

    <input
        type="password"
        id="token"
        placeholder="Paste GitHub PAT here"
    >


    <label>Owner</label>

    <input
        type="text"
        id="owner"
        value="DeeGees-Tailoring"
        readonly
    >


    <label>Repository</label>

    <input
        type="text"
        id="repo"
        value="General-Journal"
        readonly
    >


    <label>Branch</label>

    <input
        type="text"
        id="branch"
        value="main"
        readonly
    >


    <label>File</label>

    <input
        type="text"
        id="file"
        value="revenues.js"
        readonly
    >


    <label>JS File Content</label>

    <textarea id="content">// revenues.js

const revenues = {

};</textarea>


    <button id="createBtn">
        CREATE JS FILE
    </button>


    <div id="status"></div>


<script>

const createBtn = document.getElementById("createBtn");

const status = document.getElementById("status");


createBtn.addEventListener("click", async function () {

    const token =
        document.getElementById("token").value.trim();

    const owner =
        document.getElementById("owner").value.trim();

    const repo =
        document.getElementById("repo").value.trim();

    const branch =
        document.getElementById("branch").value.trim();

    const file =
        document.getElementById("file").value.trim();

    const content =
        document.getElementById("content").value;


    // Check PAT

    if (!token) {

        status.textContent =
            "ERROR: Please paste your GitHub PAT.";

        return;
    }


    // Check content

    if (!content.trim()) {

        status.textContent =
            "ERROR: JS file content is empty.";

        return;
    }


    status.textContent =
        "Creating revenues.js...";


    try {

        /*
         * Convert JS content to Base64
         */

        const encodedContent =
            btoa(
                unescape(
                    encodeURIComponent(content)
                )
            );


        /*
         * GitHub API
         */

        const url =
            `https://api.github.com/repos/${owner}/${repo}/contents/${file}`;


        const response = await fetch(url, {

            method: "PUT",

            headers: {

                "Authorization":
                    `Bearer ${token}`,

                "Accept":
                    "application/vnd.github+json",

                "Content-Type":
                    "application/json"

            },

            body: JSON.stringify({

                message:
                    "Create revenues.js",

                content:
                    encodedContent,

                branch:
                    branch

            })

        });


        const result =
            await response.json();


        /*
         * GitHub returned an error
         */

        if (!response.ok) {

            console.error(result);

            throw new Error(
                result.message ||
                "GitHub API error"
            );

        }


        /*
         * Success
         */

        status.textContent =
            "SUCCESS!\n\n" +
            "revenues.js was created successfully.";


        console.log(result);


        /*
         * Clear PAT from the input
         */

        document.getElementById("token").value = "";


    }

    catch (error) {

        console.error(error);

        status.textContent =
            "ERROR:\n\n" +
            error.message;

    }

});

</script>


</body>

</html>
